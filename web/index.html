<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudioHardcore</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#f5f5f7;background:#08080b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25121f,#09090b 55%);min-height:100vh}header{padding:22px 28px;position:sticky;top:0;background:rgba(8,8,11,.92);backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid #2b2730}.brand{font-size:26px;font-weight:900;letter-spacing:.06em}.tag{opacity:.6;font-size:12px;margin-top:4px}.wrap{max-width:1500px;margin:auto;padding:18px 28px 130px}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{background:#111116;border:1px solid #2a2830;border-radius:16px;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:260px}.input,button{border:1px solid #3c3944;background:#17171d;color:#fff;border-radius:10px;padding:10px 12px}.btn{cursor:pointer}.btn:hover{border-color:#777}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{padding:12px;border-radius:12px;background:#15151b;border:1px solid #27252d}.stat b{display:block;font-size:21px;margin-top:3px}.list{margin-top:12px;border:1px solid #29272f;border-radius:14px;overflow:hidden}.r{display:grid;grid-template-columns:42px 2fr 1.2fr 1.2fr 70px 110px;gap:10px;padding:11px 12px;border-bottom:1px solid #25232b;align-items:center}.r:last-child{border-bottom:0}.muted{opacity:.58}.small{font-size:12px}.click{cursor:pointer}.click:hover{background:#17171e}.side h3{margin:0 0 10px}.pill{display:inline-block;border:1px solid #34313a;border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}.playlist{padding:8px;border-radius:9px}.playlist:hover{background:#1a191f}.player{position:fixed;bottom:0;left:0;right:0;background:#101014;border-top:1px solid #302d36;padding:11px 18px;display:flex;gap:14px;align-items:center;z-index:10}.now{min-width:220px;flex:1}.now b,.now span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}audio{width:min(700px,55vw)}dialog{border:1px solid #3a3740;border-radius:16px;background:#121217;color:#fff;max-width:700px;width:calc(100% - 30px)}dialog::backdrop{background:#000b}form{display:grid;gap:10px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:1000px){.grid{grid-template-columns:1fr}.r{grid-template-columns:42px 2fr 1fr 70px}.hide{display:none}.stats{grid-template-columns:repeat(2,1fr)}audio{width:44vw}}</style></head><body><header><div class="brand">AUDIOHARDCORE</div><div class="tag">free / local-first / music library MVP 0.6</div></header><div class="wrap"><div class="grid"><aside class="panel side"><h3>Library</h3><button class="btn" onclick="setFilter('')">All Tracks</button><button class="btn" onclick="setFilter('favorite')">★ Favorites</button><button class="btn" onclick="loadDuplicates()">Duplicates</button><hr><h3>Playlists</h3><div id="playlists"></div><div style="margin-top:10px"><input class="input" id="newPlaylist" placeholder="New playlist"><button class="btn" onclick="createPlaylist()">Create</button></div></aside><main><div class="panel"><div class="toolbar"><input class="input" id="search" placeholder="Search artist, album, track, genre…"><input class="input" id="scanPath" placeholder="Folder path to import/scan"><button class="btn" onclick="scan()">Import</button><button class="btn" onclick="loadAll()">Refresh</button></div><div class="stats"><div class="stat">Tracks<b id="tracks">0</b></div><div class="stat">Artists<b id="artists">0</b></div><div class="stat">Albums<b id="albums">0</b></div><div class="stat">Favorites<b id="favorites">0</b></div></div><div id="msg" class="muted small"></div></div><div class="list"><div class="r muted small"><div></div><div>Track</div><div>Artist</div><div class="hide">Album</div><div>Time</div><div>Actions</div></div><div id="rows"></div></div></main></div></div><div class="player"><div class="now"><b id="nowTitle">Nothing playing</b><span id="nowArtist" class="muted"></span></div><audio id="audio" controls></audio></div><dialog id="editor"><form method="dialog"><h3>Edit Track</h3><input type="hidden" id="editId"><div class="row2"><input class="input" id="eTitle" placeholder="Title"><input class="input" id="eArtist" placeholder="Artist"></div><div class="row2"><input class="input" id="eAlbum" placeholder="Album"><input class="input" id="eAlbumArtist" placeholder="Album Artist"></div><div class="row2"><input class="input" id="eGenre" placeholder="Genre"><input class="input" id="eYear" placeholder="Year"></div><div class="row2"><input class="input" id="eTrack" placeholder="Track #"><input class="input" id="eDisc" placeholder="Disc #"></div><div><button class="btn" value="cancel">Cancel</button><button class="btn" type="button" onclick="saveEdit(false)">Save DB</button><button class="btn" type="button" onclick="saveEdit(true)">Save + Write MP3</button></div></form></dialog><script>const $=id=>document.getElementById(id);let filter='';function esc(s){return(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){if(!s)return'—';s=Math.round(s);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function setFilter(v){filter=v;loadTracks()}function q(){const v=encodeURIComponent($('search').value.trim());return v?`&q=${v}`:''}async function loadStats(){const s=await(await fetch('/library/stats')).json();$('tracks').textContent=s.tracks;$('artists').textContent=s.artists;$('albums').textContent=s.albums;$('favorites').textContent=s.favorites}async function loadTracks(){let url='/library/tracks?limit=1000'+q()+(filter==='favorite'?'&favorite=true':'');const d=await(await fetch(url)).json();$('rows').innerHTML=d.tracks.map(t=>`<div class="r click"><div onclick='play(${JSON.stringify(t)})'>${t.is_favorite?'★':'▶'}</div><div onclick='play(${JSON.stringify(t)})'><b>${esc(t.title||t.filename)}</b><div class="muted small">${esc(t.filename)}</div></div><div onclick='play(${JSON.stringify(t)})'>${esc(t.artist||'Unknown')}</div><div class="hide">${esc(t.album||'Unknown')}</div><div>${fmt(t.duration_seconds)}</div><div><button class="btn" onclick='toggleFav("${t.id}",${!!t.is_favorite})'>${t.is_favorite?'★':'☆'}</button><button class="btn" onclick='openEdit(${JSON.stringify(t)})'>Edit</button></div></div>`).join('')||'<div class="r"><div></div><div class="muted">No tracks yet — import a music folder.</div></div>'}function play(t){$('audio').src=`/media/${encodeURIComponent(t.id)}`;$('nowTitle').textContent=t.title||t.filename;$('nowArtist').textContent=[t.artist,t.album].filter(Boolean).join(' • ');$('audio').play().catch(()=>{})}async function toggleFav(id,current){await fetch(`/library/tracks/${encodeURIComponent(id)}/control`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_favorite:!current})});loadAll()}function openEdit(t){$('editId').value=t.id;['title','artist','album','albumArtist','genre','year','track','disc'].forEach(k=>$('e'+k[0].toUpperCase()+k.slice(1)).value=t[k==='track'?'track_number':k==='disc'?'disc_number':k]||'');$('editor').showModal()}async function saveEdit(writeBack){const id=$('editId').value;const body={title:$('eTitle').value,artist:$('eArtist').value,album:$('eAlbum').value,album_artist:$('eAlbumArtist').value,genre:$('eGenre').value,year:$('eYear').value,track_number:$('eTrack').value,disc_number:$('eDisc').value};const endpoint=writeBack?`/library/tracks/${encodeURIComponent(id)}/write-back`:`/library/tracks/${encodeURIComponent(id)}`;const r=await fetch(endpoint,{method:writeBack?'POST':'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();$('msg').textContent=r.ok?(writeBack?`MP3 updated. Backup: ${d.backup_path}`:'Database metadata updated.'):(d.detail||'Update failed');$('editor').close();loadAll()}async function scan(){const path=$('scanPath').value.trim();if(!path){$('msg').textContent='Enter a folder path.';return}$('msg').textContent='Scanning…';const r=await fetch('/library/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,compute_hash:true})});const d=await r.json();$('msg').textContent=r.ok?`Imported ${d.scanned} files; ${d.errors} metadata errors.`:(d.detail||'Scan failed');loadAll()}async function createPlaylist(){const name=$('newPlaylist').value.trim();if(!name)return;await fetch('/playlists',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});$('newPlaylist').value='';loadPlaylists()}async function loadPlaylists(){const ps=await(await fetch('/playlists')).json();$('playlists').innerHTML=ps.map(p=>`<div class="playlist click" onclick="showPlaylist(${p.id})">${esc(p.name)} <span class="pill">${p.track_count}</span></div>`).join('')||'<div class="muted small">None yet.</div>'}async function showPlaylist(id){const d=await(await fetch(`/playlists/${id}`)).json();$('search').value='';$('msg').textContent=`Playlist: ${d.playlist.name} — ${d.tracks.length} tracks`;$('rows').innerHTML=d.tracks.map((t,i)=>`<div class="r"><div>${i+1}</div><div><b>${esc(t.title||t.filename)}</b></div><div>${esc(t.artist||'Unknown')}</div><div class="hide">${esc(t.album||'Unknown')}</div><div>${fmt(t.duration_seconds)}</div><div><button class="btn" onclick='play(${JSON.stringify(t)})'>▶</button></div></div>`).join('')}async function loadDuplicates(){const d=await(await fetch('/library/duplicates')).json();$('msg').textContent=`Duplicate groups: ${d.groups.length} • duplicate tracks: ${d.duplicate_track_count}`;$('rows').innerHTML=d.groups.map(g=>g.tracks.map((t,i)=>`<div class="r"><div>${i?'↳':'⚠'}</div><div><b>${esc(t.title||t.filename)}</b><div class="muted small">${esc(t.path)}</div></div><div>${esc(t.artist||'Unknown')}</div><div class="hide">${esc(t.album||'Unknown')}</div><div>${(t.size_bytes/1048576).toFixed(1)} MB</div><div><button class="btn" onclick='play(${JSON.stringify(t)})'>▶</button></div></div>`).join('')).join('')||'<div class="r"><div></div><div>No duplicates detected.</div></div>'}async function loadAll(){await Promise.all([loadStats(),loadTracks(),loadPlaylists()])}let deb;$('search').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(loadTracks,200)});loadAll();</script></body></html>
