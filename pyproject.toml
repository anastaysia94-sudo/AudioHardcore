[project]
name = "audiohardcore"
version = "1.1.0"
description = "AudioHardcore music library and media ecosystem core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mutagen>=1.47,<2",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "core*", "desktop*"]
exclude = ["android*", "clients*", "releases*", "tests*", "web*", "wordpress*"]

[tool.pytest.ini_options]
pythonpath = ["."]
